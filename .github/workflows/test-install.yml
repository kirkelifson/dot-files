name: Test Install

concurrency:
  # A newer push on the same branch cancels the superseded run — no point
  # testing three pushes back-to-back; only the tip matters.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
    paths-ignore:
      # The install kit has its own workflow (arch-kit.yml); test-install
      # exercises ./install and the dotfiles, which arch/ changes can't affect.
      - "arch/**"
  pull_request:
    paths-ignore:
      - "arch/**"

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04 # resolute
    # install auto-detects CI via GitHub Actions' standard $CI var — no
    # env vars needed here to skip the package/mise installs.
    steps:
      # Test scaffolding only — fish/vim/tmux are needed to exercise the
      # install script and its config files. This is not the ~90-package
      # Brewfile/apt-get sweep, which stays skipped (see packages.yml for
      # a no-install check that those package names still resolve).
      - name: Install test prerequisites
        run: |
          apt-get update
          apt-get install -y git curl sudo ca-certificates fish vim tmux

      - uses: actions/checkout@v5

      - name: Test installer migrations and platform routing
        run: python3 test_install.py

      - name: Run install
        run: ./install

      - name: Verify symlinks point into the repo
        run: |
          set -e
          for target in "$HOME/.vimrc" "$HOME/.tmux.conf" "$HOME/.gitconfig" "$HOME/.config/fish" "$HOME/bin"; do
            if [ ! -L "$target" ]; then
              echo "::error::$target is not a symlink"
              exit 1
            fi
            resolved=$(readlink -f "$target")
            case "$resolved" in
              "$GITHUB_WORKSPACE"*) echo "OK: $target -> $resolved" ;;
              *) echo "::error::$target points outside the repo: $resolved"; exit 1 ;;
            esac
          done

      - name: Re-run install (idempotency check)
        run: |
          # The first run may back up files the runner image already had;
          # only backups created by this second run mean it isn't idempotent.
          list_backups() {
            find "$HOME" -maxdepth 4 \( -name '*-backup*' -o -name '*.backup*' \) 2>/dev/null | sort
          }
          list_backups > "$RUNNER_TEMP/backups-before"
          echo "Backups from the first run:"; cat "$RUNNER_TEMP/backups-before"
          ./install
          list_backups > "$RUNNER_TEMP/backups-after"
          if ! diff -u "$RUNNER_TEMP/backups-before" "$RUNNER_TEMP/backups-after"; then
            echo "::error::install created backup files on a second run (not idempotent)"
            exit 1
          fi

      - name: Vimrc sanity check (headless)
        run: vim -Nu "$HOME/.vimrc" -es -c quit

      - name: tmux config sanity check
        run: tmux -f "$HOME/.tmux.conf" -L citest start-server \; kill-server

      - name: gitconfig sanity check
        run: git config -f "$HOME/.gitconfig" -l > /dev/null

      - name: fish runtime sanity check
        run: fish -c 'true'

  macos:
    runs-on: macos-latest
    env:
      # The runner image's Homebrew index is fresh enough for fish/tmux;
      # a full brew update here is pure CI minutes.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      # Same scaffolding rationale as the linux job above.
      - name: Compute weekly cache key
        id: stamp
        # ISO week — the rolling key makes actions/cache refresh once a week:
        # first run of a week misses the primary key, restores last week's
        # bottles via restore-keys, installs the newest versions and re-saves.
        # A static key would be saved exactly once and go stale forever.
        run: echo "week=$(date -u +%Y-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Homebrew bottle downloads
        uses: actions/cache@v4
        with:
          # fish + tmux bottles are small; this shaves the download, not the
          # install. actions/cache is free (10 GB/repo) and does NOT count
          # against the billed Packages/Artifacts storage.
          path: ~/Library/Caches/Homebrew
          key: brew-bottles-${{ steps.stamp.outputs.week }}
          restore-keys: |
            brew-bottles-
      - name: Install test prerequisites
        run: brew install fish tmux

      - uses: actions/checkout@v5

      - name: Test installer migrations and platform routing
        run: python3 test_install.py

      - name: Run install
        run: ./install

      - name: Verify symlinks point into the repo
        run: |
          set -e
          for target in "$HOME/.vimrc" "$HOME/.tmux.conf" "$HOME/.gitconfig" "$HOME/bin"; do
            if [ ! -L "$target" ]; then
              echo "::error::$target is not a symlink"
              exit 1
            fi
          done
          ghostty_config="$HOME/Library/Application Support/com.mitchellh.ghostty/config"
          if [ ! -L "$ghostty_config" ]; then
            echo "::error::ghostty config not linked at $ghostty_config"
            exit 1
          fi

      - name: Re-run install (idempotency check)
        run: |
          # The first run may back up files the runner image already had;
          # only backups created by this second run mean it isn't idempotent.
          list_backups() {
            find "$HOME" -maxdepth 4 \( -name '*-backup*' -o -name '*.backup*' \) 2>/dev/null | sort
          }
          list_backups > "$RUNNER_TEMP/backups-before"
          echo "Backups from the first run:"; cat "$RUNNER_TEMP/backups-before"
          ./install
          list_backups > "$RUNNER_TEMP/backups-after"
          if ! diff -u "$RUNNER_TEMP/backups-before" "$RUNNER_TEMP/backups-after"; then
            echo "::error::install created backup files on a second run (not idempotent)"
            exit 1
          fi

      - name: Vimrc sanity check (headless)
        run: vim -Nu "$HOME/.vimrc" -es -c quit

      - name: tmux config sanity check
        run: tmux -f "$HOME/.tmux.conf" -L citest start-server \; kill-server

      - name: gitconfig sanity check
        run: git config -f "$HOME/.gitconfig" -l > /dev/null

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.4'
          usesh: true
          prepare: pkg install -y bash sudo git curl python3
          run: |
            set -e
            python3 test_install.py
            # Exercise the real pkg branch, then use CI mode for relinking.
            bash -c 'source <(sed "/^# --- Main ---/,$ d" install); dir="$PWD"; os=FreeBSD; CI=; DOTFILES_CI=; install_system_packages'
            CI=1 bash ./install
            CI=1 bash ./install
            test -L "$HOME/.tmux.conf"
            test -L "$HOME/.config/fish"
            test -L "$HOME/.config/mise/conf.d/dot-files.toml"
            fish -c true
            vim -Nu "$HOME/.vimrc" -es -c quit
            tmux -f "$HOME/.tmux.conf" -L citest start-server \; kill-server
