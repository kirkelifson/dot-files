# --- Prefix ---
set-option -g prefix C-a
bind-key C-a last-window
bind-key a send-prefix # <C-a> a <command> to send commands to a nested tmux session
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# --- General ---
set -g mouse on
set -g base-index 1              # Start window numbering at 1
setw -g pane-base-index 1        # Start pane numbering at 1
set-option -g renumber-windows on
set -s escape-time 0             # Faster key repetition
setw -g aggressive-resize on     # Maximize window size for connected client
set -g history-limit 50000       # Scrollback buffer
set -g focus-events on           # Let vim detect focus changes (for autoread)
# Refresh Wayland state on attach, including on older tmux releases.
set -ga update-environment " WAYLAND_DISPLAY XDG_RUNTIME_DIR"

# --- Terminal & Colors ---
set -g default-terminal "tmux-256color"
set -sa terminal-features ',xterm-ghostty:RGB'
set -sa terminal-overrides ',xterm-256color:RGB'

# Let Shift+Enter reach Claude Code as a newline instead of submitting:
# tmux otherwise can't distinguish it from plain Enter. Also lets terminal
# bell/notifications and the progress bar pass through to Ghostty.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# --- Splitting ---
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# New windows open in current path
bind c new-window -c "#{pane_current_path}"

# --- Pane Navigation (hjkl) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane Resizing (HJKL) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Vi Copy Mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Platform-aware yank to system clipboard (pbcopy on macOS, wl-copy on
# Wayland e.g. Omarchy/Hyprland, xclip on X11). The Linux choice is made when
# you yank, so a server started outside Wayland still picks the right tool.
if-shell "uname -s | grep -q Darwin" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'if [ -n \"\$WAYLAND_DISPLAY\" ] && command -v wl-copy >/dev/null; then exec wl-copy; else exec xclip -in -selection clipboard; fi'"

# --- Status Bar ---
set -g status-interval 5
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 100

set -g status-style fg=white,bg=colour237
set -g status-left '#[fg=colour73,bold] #S #[fg=white,nobold]| #(whoami)@#h'
set -g status-right '#(tmux-git-status "#{pane_current_path}") #[fg=white]| #[fg=colour248]%H:%M #[fg=white]| #[fg=colour248]%b %d'

# Window titles
setw -g window-status-format '#[fg=colour248] #I:#W '
setw -g window-status-current-format '#[fg=colour73,bold] #I:#W '

# Pane borders
set -g pane-border-style fg=colour237
set -g pane-active-border-style fg=colour73

# --- Sessionizer ---
bind f run-shell "tmux new-window tmux-sessionizer"

# --- Agents ---
# Launch/attach the multi-agent layout (agent, agents grid, git, monitor,
# debug windows) for the current pane's project directory
bind A run-shell "tmux new-window -c '#{pane_current_path}' tmux-agents"

# Swap which agent CLI is running in the focused pane in place
bind e display-menu -T "#[align=centre]Switch Agent" \
  "Claude"   c "respawn-pane -k -c '#{pane_current_path}' 'claude'" \
  "OpenCode" o "respawn-pane -k -c '#{pane_current_path}' 'opencode'" \
  "Gemini"   g "respawn-pane -k -c '#{pane_current_path}' 'gemini'" \
  "Grok"     x "respawn-pane -k -c '#{pane_current_path}' 'grok'" \
  "Hermes"   h "respawn-pane -k -c '#{pane_current_path}' 'hermes'"

# Jump straight to a window by role, regardless of its index
bind G select-window -t git
bind M select-window -t monitor
bind D select-window -t debug

# Create/open a git worktree + its own agents session for a branch, so
# parallel agents on the same repo never fight over one checkout
bind W command-prompt -p "worktree branch:" "run-shell 'tmux new-window tmux-worktree %1'"

# Manual layout toggle for the current window: T(iled) grid for a wide
# external display, V(ertical) main pane + stack for the laptop screen.
# (also see the client-attached hook below, which does this automatically)
bind T select-layout tiled
bind V select-layout main-vertical

# Auto-fit the agents window's layout to whichever screen you just
# attached from (laptop vs. an external/widescreen display)
set-hook -g client-attached 'run-shell "tmux-fit-layout #{session_name} #{client_width}"'

# --- Activity / Attention ---
# Flag windows where an agent is waiting on you. monitor-activity is
# deliberately NOT used here: it fires on any byte of output, so a
# streaming/animating agent trips it the instant you switch away from its
# window. monitor-bell only fires on an actual BEL (\a), which is rare
# enough to be a meaningful signal instead of noise.
set -g monitor-bell on
set -g visual-bell off
setw -g window-status-bell-style fg=red,bold

# --- Shell ---
set-option -g default-shell $SHELL
set -g default-command $SHELL
