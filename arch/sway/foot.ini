# foot terminal — dot-files desktop.
# Installed to ~/.config/foot/foot.ini by post-install.sh.
# foot's default is 8pt, unreadably tiny on the 4K display at scale 1.
font=FiraCode Nerd Font:size=14

[url]
# foot has no hover-click on URLs (upstream: keyboard-driven by design).
# Ctrl+Shift+o enters URL mode: links get jump labels, press the label to
# open with xdg-open. This makes OSC-8 links (emitted by many CLIs) always
# underlined so they read as links outside URL mode too.
osc8-underline=always
style=single

[colors-dark]
# Slight transparency (1.0 = opaque). Stacks with sway's window opacity.
alpha=0.9
