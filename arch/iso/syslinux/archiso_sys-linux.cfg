LABEL arch
TEXT HELP
Boot the dot-files Arch installer (BIOS).
It includes the archinstall-driven unattended flow; see /root/autostart.sh.
ENDTEXT
MENU LABEL dot-files Arch installer (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
